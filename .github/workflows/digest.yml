name: good-news-digest

on:
  schedule:
    # 6:00 a.m. and 8:00 p.m. Toronto, in both EDT and EST. GitHub cron is UTC only,
    # so both candidates are listed and digest.py exits unless Toronto time is in an
    # edition window (see SLOTS in digest.py). The second entry also retries a failure.
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
    - cron: "0 0 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write # lets the job commit state/state.json (stories already delivered)

concurrency:
  group: good-news-digest
  cancel-in-progress: false

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python digest.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
          # Optional: set a repository variable GEMINI_MODELS (comma-separated) to change models.
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
      - name: Save delivered-story state
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "Record delivered stories"
            git push
          fi
