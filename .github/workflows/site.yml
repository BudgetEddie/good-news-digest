name: good-news-website

on:
  schedule:
    # Every 3 hours. GitHub often starts scheduled jobs late, which only makes an update late.
    # Minute 41 keeps clear of the Kindle digest's :17 runs and GitHub's busy top of the hour.
    - cron: "41 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write # commit state/site.json (published stories and what was already judged)
  pages: write
  id-token: write

concurrency:
  group: good-news-website
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: pages
        uses: actions/configure-pages@v5
      - run: python site_build.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          # Set a repository variable SITE_URL once you have a custom domain.
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
      - name: Save site archive
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "Update website stories"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
